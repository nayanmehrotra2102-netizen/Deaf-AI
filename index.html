<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — AI Interface</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #08090b;
      --bg: #0c0d10;
      --surface: rgba(18, 19, 24, 0.72);
      --surface-2: rgba(28, 30, 38, 0.55);
      --surface-3: rgba(36, 38, 48, 0.4);
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-strong: rgba(255, 255, 255, 0.1);
      --text: #e4e4e8;
      --text-secondary: #a0a0aa;
      --text-muted: #6b6b76;
      --accent: #7a8a9a;
      --accent-soft: rgba(122, 138, 154, 0.15);
      --user-glass: rgba(40, 44, 56, 0.65);
      --ai-glass: rgba(22, 24, 30, 0.7);
      --danger: #c45c5c;
      --blur: 24px;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.25);
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      display: flex;
      overflow: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle background grid / HUD texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(40, 48, 64, 0.25), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: transform var(--transition), width var(--transition);
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--glass-border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-mark::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      opacity: 0.7;
    }

    .logo-text {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    .logo-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-top: 1px;
    }

    .sidebar-section {
      padding: 14px 12px 8px;
      flex: 1;
      overflow-y: auto;
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 8px 10px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: transparent;
    }

    .history-item:hover {
      background: var(--glass);
      border-color: var(--glass-border);
      color: var(--text);
    }

    .history-item.active {
      background: var(--surface-2);
      border-color: var(--glass-border-strong);
      color: var(--text);
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: 8px 10px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ctrl-btn:hover {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--glass-border-strong);
    }

    .ctrl-btn svg {
      width: 12px;
      height: 12px;
      opacity: 0.7;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xs);
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .model-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #6a8a7a;
      flex-shrink: 0;
    }

    .model-badge span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ========== MAIN ========== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    /* Top bar */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(12, 13, 16, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    .status-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ai-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--glass-border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .ai-avatar-inner {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: linear-gradient(135deg, rgba(160,170,185,0.5), rgba(100,110,130,0.3));
      border: 1px solid rgba(255,255,255,0.12);
    }

    .ai-avatar.thinking .ai-avatar-inner {
      animation: pulse-core 1.6s ease-in-out infinite;
    }

    @keyframes pulse-core {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .ai-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .ai-name {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .ai-state {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .state-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #5a7a6a;
    }

    .state-dot.active {
      background: #7a9a8a;
      box-shadow: 0 0 6px rgba(122, 154, 138, 0.35);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .icon-btn:hover {
      background: var(--glass);
      border-color: var(--glass-border);
      color: var(--text);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .menu-toggle {
      display: none;
    }

    /* Chat workspace */
    .workspace {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px 120px;
      scroll-behavior: smooth;
      position: relative;
    }

    .workspace::-webkit-scrollbar {
      width: 6px;
    }

    .workspace::-webkit-scrollbar-track {
      background: transparent;
    }

    .workspace::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
    }

    .messages {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .empty-icon-inner {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--text-muted);
      opacity: 0.5;
    }

    .empty-state h2 {
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.55;
    }

    /* Message cards */
    .message {
      display: flex;
      gap: 14px;
      animation: msg-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes msg-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .message.user .msg-avatar {
      background: rgba(50, 54, 68, 0.6);
    }

    .msg-avatar-inner {
      width: 10px;
      height: 10px;
      border-radius: 2.5px;
      background: rgba(160, 170, 185, 0.35);
    }

    .message.user .msg-avatar-inner {
      background: rgba(180, 190, 210, 0.45);
      border-radius: 50%;
      width: 8px;
      height: 8px;
    }

    .msg-card {
      max-width: min(580px, 85%);
      padding: 14px 18px;
      border-radius: var(--radius);
      background: var(--ai-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .message.user .msg-card {
      background: var(--user-glass);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .msg-role {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .msg-content {
      font-size: 0.925rem;
      line-height: 1.6;
      color: var(--text);
      word-break: break-word;
    }

    /* Markdown inside AI messages */
    .msg-content h1, .msg-content h2, .msg-content h3 {
      margin: 0.9em 0 0.4em;
      font-weight: 550;
      letter-spacing: -0.02em;
    }
    .msg-content h1 { font-size: 1.2rem; }
    .msg-content h2 { font-size: 1.08rem; }
    .msg-content h3 { font-size: 0.98rem; }
    .msg-content p { margin: 0.45em 0; }
    .msg-content ul, .msg-content ol {
      margin: 0.5em 0;
      padding-left: 1.35em;
    }
    .msg-content li { margin: 0.2em 0; }
    .msg-content code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.84em;
      background: rgba(255,255,255,0.05);
      padding: 0.12em 0.38em;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .msg-content pre {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0.7em 0;
    }
    .msg-content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .msg-content a {
      color: #9aa8b8;
      text-decoration: none;
      border-bottom: 1px solid rgba(154,168,184,0.3);
    }
    .msg-content a:hover {
      color: #b8c4d0;
      border-bottom-color: rgba(184,196,208,0.5);
    }
    .msg-content blockquote {
      border-left: 2px solid rgba(255,255,255,0.12);
      margin: 0.6em 0;
      padding-left: 14px;
      color: var(--text-secondary);
    }
    .msg-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.6em 0;
      font-size: 0.88rem;
    }
    .msg-content th, .msg-content td {
      border: 1px solid var(--glass-border);
      padding: 6px 10px;
      text-align: left;
    }
    .msg-content th {
      background: rgba(255,255,255,0.03);
    }

    /* Typing / thinking animation */
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
    }

    .thinking-bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 14px;
    }

    .thinking-bars span {
      width: 2.5px;
      background: var(--text-muted);
      border-radius: 1px;
      animation: bar-pulse 1.2s ease-in-out infinite;
    }

    .thinking-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .thinking-bars span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .thinking-bars span:nth-child(3) { height: 14px; animation-delay: 0.3s; }
    .thinking-bars span:nth-child(4) { height: 8px; animation-delay: 0.45s; }

    @keyframes bar-pulse {
      0%, 100% { opacity: 0.3; transform: scaleY(0.7); }
      50% { opacity: 0.9; transform: scaleY(1); }
    }

    .thinking-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* Error message */
    .message.error .msg-card {
      background: rgba(60, 30, 30, 0.4);
      border-color: rgba(196, 92, 92, 0.25);
    }

    .message.error .msg-content {
      color: #c89090;
      font-size: 0.88rem;
    }

    /* ========== FLOATING INPUT ========== */
    .input-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 24px 24px;
      pointer-events: none;
      z-index: 5;
    }

    .input-shell {
      max-width: 760px;
      margin: 0 auto;
      pointer-events: auto;
      background: rgba(16, 17, 22, 0.75);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border-strong);
      border-radius: 18px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255,255,255,0.02) inset;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px 10px 16px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-shell:focus-within {
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255,255,255,0.04) inset;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.925rem;
      line-height: 1.45;
      padding: 8px 4px;
      resize: none;
      min-height: 24px;
      max-height: 140px;
      outline: none;
    }

    #user-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .send-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border-color: var(--glass-border-strong);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
    }

    .send-btn.loading svg {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9;
      backdrop-filter: blur(4px);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        z-index: 20;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.visible {
        display: block;
      }

      .menu-toggle {
        display: flex;
      }

      .workspace {
        padding: 20px 16px 110px;
      }

      .input-dock {
        padding: 0 12px 16px;
      }

      .topbar {
        padding: 0 14px;
      }

      .msg-card {
        max-width: 90%;
      }
    }

    @media (max-width: 480px) {
      .ai-meta .ai-name {
        font-size: 0.8rem;
      }
      .empty-state h2 {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark"></div>
      <div>
        <div class="logo-text">Nexus</div>
        <div class="logo-sub">AI Interface</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Session</div>
      <div class="history-list" id="history-list">
        <div class="history-item active" data-id="current">Current conversation</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="model-badge">
        <span class="dot"></span>
        <span title="nvidia/nemotron-nano-9b-v2:free">nemotron-nano-9b</span>
      </div>
      <div class="control-row">
        <button class="ctrl-btn" id="clear-btn" title="Clear conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
          Clear
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="status-cluster">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="ai-status">
          <div class="ai-avatar" id="ai-avatar">
            <div class="ai-avatar-inner"></div>
          </div>
          <div class="ai-meta">
            <div class="ai-name">Nexus</div>
            <div class="ai-state">
              <span class="state-dot" id="state-dot"></span>
              <span id="state-text">Ready</span>
            </div>
          </div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="search-hint" title="Web search activates for current/latest queries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace" id="chat">
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">
            <div class="empty-icon-inner"></div>
          </div>
          <h2>System ready</h2>
          <p>Ask anything. Current or latest information triggers live web search automatically.</p>
        </div>
      </div>
    </div>

    <div class="input-dock">
      <div class="input-shell">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Transmit message…"
          autofocus
        ></textarea>
        <button class="send-btn" id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ============ CONFIG ============
    const OPENROUTER_API_KEY = "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";
    const OPENROUTER_MODEL = "nvidia/nemotron-nano-9b-v2:free";
    const TINYFISH_API_KEY = "sk-tinyfish-4Bga_ZJkP-Ifu8i5HZVWBoWvnp5fsiUD";

    // ============ STATE ============
    const messages = [];
    let isLoading = false;

    // ============ DOM ============
    const chatEl = document.getElementById("chat");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const emptyState = document.getElementById("empty-state");
    const aiAvatar = document.getElementById("ai-avatar");
    const stateDot = document.getElementById("state-dot");
    const stateText = document.getElementById("state-text");
    const sidebar = document.getElementById("sidebar");
    const menuToggle = document.getElementById("menu-toggle");
    const sidebarOverlay = document.getElementById("sidebar-overlay");

    // ============ MARKED ============
    marked.setOptions({ breaks: true, gfm: true });

    // ============ HELPERS ============
    function needsWebSearch(text) {
      const lower = text.toLowerCase();
      const triggers = [
        "latest", "current", "today", "now", "recent", "news",
        "what is the", "who is the", "when is", "how much is",
        "price of", "stock", "weather", "score", "update",
        "2024", "2025", "2026", "this year", "this month", "this week"
      ];
      return triggers.some(t => lower.includes(t));
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
      });
    }

    function setLoading(loading) {
      isLoading = loading;
      sendBtn.disabled = loading;
      inputEl.disabled = loading;
      sendBtn.classList.toggle("loading", loading);
      aiAvatar.classList.toggle("thinking", loading);
      stateDot.classList.toggle("active", loading);
      stateText.textContent = loading ? "Processing" : "Ready";
    }

    function hideEmpty() {
      if (emptyState) emptyState.style.display = "none";
    }

    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text || ""));
    }

    // ============ UI RENDERING ============
    function appendMessage(role, content, isStreaming = false) {
      hideEmpty();
      const wrap = document.createElement("div");
      wrap.className = `message ${role === "user" ? "user" : "ai"}`;
      wrap.dataset.role = role;

      const avatar = document.createElement("div");
      avatar.className = "msg-avatar";
      avatar.innerHTML = '<div class="msg-avatar-inner"></div>';

      const card = document.createElement("div");
      card.className = "msg-card";

      const roleEl = document.createElement("div");
      roleEl.className = "msg-role";
      roleEl.textContent = role === "user" ? "You" : "Nexus";

      const contentEl = document.createElement("div");
      contentEl.className = "msg-content";

      if (role === "user") {
        contentEl.textContent = content;
      } else if (isStreaming) {
        contentEl.innerHTML = `
          <div class="thinking">
            <div class="thinking-bars"><span></span><span></span><span></span><span></span></div>
            <span class="thinking-label">Thinking</span>
          </div>`;
      } else {
        contentEl.innerHTML = renderMarkdown(content);
      }

      card.appendChild(roleEl);
      card.appendChild(contentEl);
      wrap.appendChild(avatar);
      wrap.appendChild(card);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function updateAIMessage(wrap, text) {
      const contentEl = wrap.querySelector(".msg-content");
      contentEl.innerHTML = renderMarkdown(text);
      scrollToBottom();
    }

    function showError(msg) {
      hideEmpty();
      const wrap = document.createElement("div");
      wrap.className = "message error";
      const card = document.createElement("div");
      card.className = "msg-card";
      const contentEl = document.createElement("div");
      contentEl.className = "msg-content";
      contentEl.textContent = msg;
      card.appendChild(contentEl);
      wrap.appendChild(card);
      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    // ============ TINYFISH ============
    async function searchWeb(query) {
      const url = new URL("https://api.search.tinyfish.ai");
      url.searchParams.set("query", query);
      url.searchParams.set("location", "US");
      url.searchParams.set("language", "en");

      const res = await fetch(url.toString(), {
        method: "GET",
        headers: { "X-API-Key": TINYFISH_API_KEY },
      });

      if (!res.ok) {
        const errText = await res.text().catch(() => "");
        throw new Error(`Search failed (${res.status}): ${errText || res.statusText}`);
      }

      const data = await res.json();
      const results = data.results || [];
      if (!results.length) return "No relevant web results found.";

      return results.slice(0, 6).map((r, i) => {
        return `${i + 1}. **${r.title || "Untitled"}**\n   ${r.snippet || ""}\n   URL: ${r.url || ""}`;
      }).join("\n\n");
    }

    // ============ OPENROUTER STREAM ============
    async function streamChat(apiMessages, onDelta) {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
          "Content-Type": "application/json",
          "HTTP-Referer": window.location.origin || "https://localhost",
          "X-Title": "Nexus AI Interface",
        },
        body: JSON.stringify({
          model: OPENROUTER_MODEL,
          messages: apiMessages,
          stream: true,
          temperature: 0.7,
        }),
      });

      if (!res.ok) {
        const errText = await res.text().catch(() => "");
        throw new Error(`Model error (${res.status}): ${errText || res.statusText}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith(":")) continue;
          if (trimmed === "data: [DONE]") continue;
          if (!trimmed.startsWith("data: ")) continue;

          try {
            const json = JSON.parse(trimmed.slice(6));
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullText += delta;
              onDelta(fullText);
            }
            if (json.error) {
              throw new Error(json.error.message || JSON.stringify(json.error));
            }
          } catch (e) {
            if (e instanceof SyntaxError) continue;
            throw e;
          }
        }
      }

      return fullText;
    }

    // ============ SEND ============
    async function handleSend() {
      const text = inputEl.value.trim();
      if (!text || isLoading) return;

      inputEl.value = "";
      autoResize();
      setLoading(true);

      messages.push({ role: "user", content: text });
      appendMessage("user", text);

      const aiWrap = appendMessage("assistant", "", true);
      let reply = "";

      try {
        let systemContent = "You are Nexus, a precise and capable AI assistant. Respond clearly and concisely. Use Markdown when it improves readability.";

        if (needsWebSearch(text)) {
          try {
            const searchResults = await searchWeb(text);
            systemContent += `\n\nThe user needs current information. Use these live web results:\n\n${searchResults}\n\nCite sources by title or URL when relevant.`;
          } catch (searchErr) {
            console.warn("Search failed:", searchErr);
            systemContent += "\n\n(Web search failed. Answer with available knowledge and note that live data was unavailable.)";
          }
        }

        const apiMessages = [
          { role: "system", content: systemContent },
          ...messages.map(m => ({ role: m.role, content: m.content })),
        ];

        reply = await streamChat(apiMessages, (partial) => {
          updateAIMessage(aiWrap, partial);
        });

        if (!reply) {
          reply = "(No response generated.)";
          updateAIMessage(aiWrap, reply);
        }

        messages.push({ role: "assistant", content: reply });
      } catch (err) {
        console.error(err);
        aiWrap.remove();
        showError(err.message || "Transmission failed. Please retry.");
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    // ============ EVENTS ============
    sendBtn.addEventListener("click", handleSend);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    inputEl.addEventListener("input", autoResize);

    clearBtn.addEventListener("click", () => {
      if (isLoading) return;
      messages.length = 0;
      messagesEl.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.id = "empty-state";
      empty.innerHTML = `
        <div class="empty-icon"><div class="empty-icon-inner"></div></div>
        <h2>System ready</h2>
        <p>Ask anything. Current or latest information triggers live web search automatically.</p>`;
      messagesEl.appendChild(empty);
      inputEl.focus();
      closeSidebar();
    });

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("visible");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("visible");
    }

    menuToggle.addEventListener("click", () => {
      if (sidebar.classList.contains("open")) closeSidebar();
      else openSidebar();
    });

    sidebarOverlay.addEventListener("click", closeSidebar);

    inputEl.focus();
  </script>
</body>
</html>
